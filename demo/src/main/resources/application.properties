# Nome applicazione
spring.application.name=sushi-backend

# Impostazione del profilo attivo (se non specificato diversamente)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Configurazione MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sushi_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gestione upload immagini (es. foto piatti sushi)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring Security & JWT Configuration
# La chiave deve essere sufficientemente lunga (almeno 256 bit / 32 caratteri per HMAC-SHA256)
jwt.secret=jwt.secret=${JWT_SECRET:dEoJ34YXfAADXirtVhKGxPuSIB2y2t6TO5iCTtr40ZdRc0X0LcCtSQs09PNPDjuo}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Aggiungi queste righe al tuo application.properties

# Cartella dove vengono salvate le foto (le immagini finiscono in <cartella>/piatti)
# In produzione usa un percorso assoluto su un volume persistente, es. /var/data/uploads
app.upload-dir=uploads

# Limite dimensione upload (il frontend comprime già a ~200-400 KB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB


app.admin.nome=admin
app.admin.password=admin